# Local development services. Start with: docker compose up -d
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: sipboard
      POSTGRES_USER: sipboard
      POSTGRES_PASSWORD: sipboard
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sipboard -d sipboard"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
